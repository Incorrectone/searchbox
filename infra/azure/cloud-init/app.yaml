#cloud-config
package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - curl

write_files:
  - path: /etc/sysctl.d/99-tailscale.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1

runcmd:
  - [sh, -c, "fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab"]
  - sysctl --system
  - [sh, -c, "curl -fsSL https://tailscale.com/install.sh | sh"]
  - tailscale up --authkey=${ts_authkey} --ssh --advertise-tags=tag:app --advertise-routes=10.20.3.0/28 --hostname=antiseo-app